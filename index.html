<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeliSwipe</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #6366f1;
      --border-color: #334155;
    }

    body.theme-light {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --accent-color: #4f46e5;
      --border-color: #cbd5e1;
    }

    body.theme-oled {
      --bg-color: #000000;
      --card-bg: #000000;
      --text-color: #ffffff;
      --accent-color: #818cf8;
      --border-color: #262626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); transition: background 0.3s, color 0.3s; display: flex; flex-direction: column; min-height: 100vh; }

    header { display: flex; justify-content: space-between; align-items: center; padding: 1rem; background: var(--card-bg); border-bottom: 1px solid var(--border-color); }
    h1 { font-size: 1.25rem; font-weight: 700; color: var(--accent-color); }

    nav { display: flex; justify-content: space-around; background: var(--card-bg); border-top: 1px solid var(--border-color); position: fixed; bottom: 0; width: 100%; z-index: 10; }
    nav button { background: none; border: none; color: var(--text-color); padding: 0.75rem 1rem; font-size: 0.9rem; cursor: pointer; opacity: 0.7; }
    nav button.active { opacity: 1; border-bottom: 2px solid var(--accent-color); color: var(--accent-color); font-weight: bold; }

    main { flex: 1; padding: 1rem; margin-bottom: 4rem; display: flex; flex-direction: column; align-items: center; }
    .tab-content { width: 100%; max-width: 480px; display: none; }
    .tab-content.active { display: block; }

    /* Card & Buttons */
    .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; position: relative; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .card img { width: 100%; height: 380px; object-fit: cover; }
    .card-info { padding: 1rem; }
    .card-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 0.5rem; }
    .card-overview { font-size: 0.85rem; opacity: 0.8; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    
    .actions { display: flex; gap: 1rem; margin-top: 1rem; width: 100%; }
    .btn { flex: 1; padding: 0.75rem; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; font-size: 1rem; }
    .btn-skip { background: #ef4444; color: white; }
    .btn-seen { background: #22c55e; color: white; }
    .btn-roulette { background: #8b5cf6; color: white; width: 100%; margin-top: 0.75rem; }

    /* Settings & Stats */
    .section-box { background: var(--card-bg); border: 1px solid var(--border-color); padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
    .section-title { font-weight: bold; margin-bottom: 0.5rem; display: block; color: var(--accent-color); }
    select, input { width: 100%; padding: 0.5rem; background: var(--bg-color); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 6px; margin-bottom: 0.75rem; }
    
    /* Achievements Badge */
    .badge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; text-align: center; }
    .badge-item { background: var(--bg-color); border: 1px solid var(--border-color); padding: 0.5rem; border-radius: 6px; font-size: 0.75rem; opacity: 0.4; }
    .badge-item.unlocked { opacity: 1; border-color: #f59e0b; }
    .badge-icon { font-size: 1.5rem; display: block; margin-bottom: 0.2rem; }

    /* List items */
    .seen-item { display: flex; align-items: center; justify-content: space-between; padding: 0.5rem; border-bottom: 1px solid var(--border-color); }
    .rating-btns { display: flex; gap: 0.25rem; }
    .btn-rate { background: none; border: 1px solid var(--border-color); padding: 0.25rem 0.5rem; border-radius: 4px; cursor: pointer; }
    .btn-rate.active { background: var(--accent-color); color: white; }
  </style>
</head>
<body class="theme-dark">

  <header>
    <h1>🎬 PeliSwipe</h1>
    <span id="party-match" style="font-size: 0.8rem; font-weight: bold; color: #10b981;"></span>
  </header>

  <main>
    <!-- TAB 1: DESCUBRIR -->
    <div id="tab-discover" class="tab-content active">
      <div id="movie-card" class="card">
        <img id="card-img" src="" alt="Poster">
        <div class="card-info">
          <div id="card-title" class="card-title">Cargando...</div>
          <p id="card-overview" class="card-overview"></p>
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-skip" onclick="swipe('skip')">❌ <span data-i18n="skip">Descartar</span></button>
        <button class="btn btn-seen" onclick="swipe('seen')">✓ <span data-i18n="seen">Ya la vi</span></button>
      </div>
      <button class="btn btn-roulette" onclick="triggerRoulette()">🎲 <span data-i18n="roulette">Ruleta Rápida</span></button>
    </div>

    <!-- TAB 2: VISTAS & CALIFICACIÓN -->
    <div id="tab-history" class="tab-content">
      <div class="section-box">
        <span class="section-title" data-i18n="historyTitle">Mis Películas Vistas</span>
        <div id="history-list"></div>
      </div>
    </div>

    <!-- TAB 3: AJUSTES & METRICAS -->
    <div id="tab-settings" class="tab-content">
      <div class="section-box">
        <span class="section-title" data-i18n="theme">Tema de pantalla</span>
        <select id="theme-select" onchange="changeTheme(this.value)">
          <option value="dark">Oscuro (Defecto)</option>
          <option value="oled">OLED Puro (Negro #000)</option>
          <option value="light">Claro</option>
        </select>
      </div>

      <div class="section-box">
        <span class="section-title" data-i18n="lang">Idioma</span>
        <select id="lang-select" onchange="changeLanguage(this.value)">
          <option value="es-ES">Español</option>
          <option value="en-US">English</option>
        </select>
      </div>

      <div class="section-box">
        <span class="section-title" data-i18n="stats">📊 Tus Estadísticas</span>
        <p id="stat-count" style="font-size:0.85rem;">Vistas: 0</p>
        <p id="stat-time" style="font-size:0.85rem;">Tiempo estimado: 0 hrs</p>
      </div>

      <div class="section-box">
        <span class="section-title" data-i18n="achievements">🏆 Logros</span>
        <div class="badge-grid">
          <div id="badge-1" class="badge-item"><span class="badge-icon">🍿</span><span data-i18n="b1">Primer Swipe</span></div>
          <div id="badge-2" class="badge-item"><span class="badge-icon">🎬</span><span data-i18n="b2">10 Vistas</span></div>
          <div id="badge-3" class="badge-item"><span class="badge-icon">🌙</span><span data-i18n="b3">Modo OLED</span></div>
        </div>
      </div>

      <div class="section-box">
        <span class="section-title">API Key (TMDB)</span>
        <input type="text" id="api-key-input" placeholder="Tu TMDB API Key">
        <button class="btn" style="background:var(--border-color); color:var(--text-color);" onclick="saveApiKey()">Guardar Key</button>
      </div>
    </div>
  </main>

  <nav>
    <button class="active" onclick="switchTab('discover', this)" data-i18n="navDiscover">Descubrir</button>
    <button onclick="switchTab('history', this)" data-i18n="navHistory">Vistas</button>
    <button onclick="switchTab('settings', this)" data-i18n="navSettings">Ajustes</button>
  </nav>

  <script>
    const i18n = {
      'es-ES': {
        skip: "Descartar", seen: "Ya la vi", roulette: "Ruleta Rápida",
        historyTitle: "Mis Películas Vistas (Calificación)", theme: "Tema de Pantalla",
        lang: "Idioma", stats: "📊 Tus Estadísticas", achievements: "🏆 Logros",
        b1: "Primer Swipe", b2: "10 Vistas", b3: "Modo OLED",
        navDiscover: "Descubrir", navHistory: "Vistas", navSettings: "Ajustes"
      },
      'en-US': {
        skip: "Skip", seen: "Seen it", roulette: "Quick Roulette",
        historyTitle: "Watched Movies (Rating)", theme: "Screen Theme",
        lang: "Language", stats: "📊 Your Stats", achievements: "🏆 Achievements",
        b1: "First Swipe", b2: "10 Watched", b3: "OLED Mode",
        navDiscover: "Discover", navHistory: "Watched", navSettings: "Settings"
      }
    };

    let state = {
      apiKey: localStorage.getItem('tmdb_key') || '',
      lang: localStorage.getItem('app_lang') || 'es-ES',
      theme: localStorage.getItem('app_theme') || 'dark',
      seenMovies: JSON.parse(localStorage.getItem('seen_movies') || '{}'),
      currentMovies: [],
      currentIndex: 0,
      page: 1
    };

    document.addEventListener("DOMContentLoaded", () => {
      applyTheme(state.theme);
      applyLanguage(state.lang);
      updateStats();
      checkBadges();
      if(state.apiKey) fetchMovies();
    });

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tabId).classList.add('active');
      btn.classList.add('active');
      if(tabId === 'history') renderHistory();
    }

    function changeTheme(val) {
      state.theme = val;
      localStorage.setItem('app_theme', val);
      applyTheme(val);
      checkBadges();
    }

    function applyTheme(val) {
      document.body.className = 'theme-' + val;
      document.getElementById('theme-select').value = val;
    }

    function changeLanguage(val) {
      state.lang = val;
      localStorage.setItem('app_lang', val);
      applyLanguage(val);
      if(state.apiKey) fetchMovies();
    }

    function applyLanguage(lang) {
      document.getElementById('lang-select').value = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if(i18n[lang][key]) el.textContent = i18n[lang][key];
      });
    }

    function saveApiKey() {
      const val = document.getElementById('api-key-input').value.trim();
      if(val) {
        state.apiKey = val;
        localStorage.setItem('tmdb_key', val);
        fetchMovies();
      }
    }

    async function fetchMovies() {
      if(!state.apiKey) return;
      const url = `https://api.themoviedb.org/3/movie/popular?api_key=${state.apiKey}&language=${state.lang}&page=${state.page}`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        state.currentMovies = data.results || [];
        state.currentIndex = 0;
        renderCard();
      } catch(e) { console.error(e); }
    }

    function renderCard() {
      if(state.currentIndex >= state.currentMovies.length) {
        state.page++;
        fetchMovies();
        return;
      }
      const movie = state.currentMovies[state.currentIndex];
      document.getElementById('card-img').src = movie.poster_path ? `https://image.tmdb.org/t/p/w500${movie.poster_path}` : '';
      document.getElementById('card-title').textContent = movie.title;
      document.getElementById('card-overview').textContent = movie.overview || '';
    }

    function swipe(action) {
      const movie = state.currentMovies[state.currentIndex];
      if(movie && action === 'seen') {
        state.seenMovies[movie.id] = { title: movie.title, rating: null };
        localStorage.setItem('seen_movies', JSON.stringify(state.seenMovies));
        updateStats();
        checkBadges();
      }
      state.currentIndex++;
      renderCard();
    }

    function triggerRoulette() {
      if(!state.currentMovies.length) return;
      const randIndex = Math.floor(Math.random() * state.currentMovies.length);
      state.currentIndex = randIndex;
      renderCard();
    }

    function renderHistory() {
      const container = document.getElementById('history-list');
      container.innerHTML = '';
      const keys = Object.keys(state.seenMovies);
      if(!keys.length) { container.innerHTML = '<p style="font-size:0.8rem; opacity:0.6;">Sin películas registradas</p>'; return; }

      keys.forEach(id => {
        const item = state.seenMovies[id];
        const div = document.createElement('div');
        div.className = 'seen-item';
        div.innerHTML = `
          <span style="font-size:0.9rem;">${item.title}</span>
          <div class="rating-btns">
            <button class="btn-rate ${item.rating === 'down' ? 'active' : ''}" onclick="rateMovie(${id}, 'down')">👎</button>
            <button class="btn-rate ${item.rating === 'up' ? 'active' : ''}" onclick="rateMovie(${id}, 'up')">👍</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function rateMovie(id, rating) {
      state.seenMovies[id].rating = rating;
      localStorage.setItem('seen_movies', JSON.stringify(state.seenMovies));
      renderHistory();
    }

    function updateStats() {
      const count = Object.keys(state.seenMovies).length;
      document.getElementById('stat-count').textContent = `Vistas: ${count}`;
      document.getElementById('stat-time').textContent = `Tiempo estimado: ${Math.round(count * 2)} hrs`;
    }

    function checkBadges() {
      const count = Object.keys(state.seenMovies).length;
      if(count > 0) document.getElementById('badge-1').classList.add('unlocked');
      if(count >= 10) document.getElementById('badge-2').classList.add('unlocked');
      if(state.theme === 'oled') document.getElementById('badge-3').classList.add('unlocked');
    }
  </script>
</body>
</html>
