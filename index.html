<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PeliSwipe</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎬%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f4f4f7;--fg:#1a1a22;--card:#fff;--mut:#6b6b7a;--ac:#6d28d9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#000;--fg:#f1f1f6;--card:#121214;--mut:#9a9aab;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:8px 6px;justify-content:center;background:var(--bg);border-bottom:1px solid #8882}
nav button{flex:1 1 calc(25% - 6px);min-width:75px;border:0;border-radius:12px;padding:10px 4px;background:var(--card);color:var(--fg);font-weight:600;font-size:12px;cursor:pointer;white-space:nowrap;box-shadow:0 2px 6px #0001}
nav button.on{background:var(--ac);color:#fff}
main{flex:1;display:flex;flex-direction:column;align-items:center;min-height:0;padding:0 14px 10px;position:relative}
.hint{color:var(--mut);font-size:13px;margin:4px 0 8px;text-align:center}
#deck{position:relative;flex:1;width:100%;max-width:380px;min-height:0}
.card{position:absolute;inset:0;border-radius:22px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;box-shadow:0 8px 24px #0004;touch-action:none;user-select:none;background:#333 center/cover;cursor:grab}
.card .play-hint{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.7);border-radius:24px;padding:8px 14px;font-size:14px;font-weight:600;backdrop-filter:blur(6px);cursor:pointer}
kbd{background:var(--card);border:1px solid #8885;border-radius:5px;padding:1px 6px;font-size:12px;font-family:inherit}
.card.back{transform:scale(.95) translateY(10px);opacity:.7}
.info{padding:60px 20px 20px;background:linear-gradient(transparent,#000d)}
.info h2{margin:0;font-size:24px;line-height:1.2}.info p{margin:4px 0 0;opacity:.85;font-size:13px}
.tag{position:absolute;top:24px;padding:4px 12px;border:4px solid;border-radius:10px;font-size:20px;font-weight:800;opacity:0;background:#0006}
.tag.r{right:16px;color:#4ade80;border-color:#4ade80;transform:rotate(12deg)}.tag.l{left:16px;color:#f87171;border-color:#f87171;transform:rotate(-12deg)}
.btns{display:flex;gap:10px;padding:12px 0 4px;align-items:center}
.btns button{height:56px;padding:0 16px;border-radius:28px;border:0;font-size:14px;font-weight:700;background:var(--card);color:var(--fg);box-shadow:0 3px 10px #0003;cursor:pointer}
.btns button.sm{width:46px;height:46px;padding:0;font-size:20px}
.empty{margin:auto;text-align:center;color:var(--mut);padding:20px}
.list{width:100%;max-width:520px;overflow-y:auto;flex:1;padding-bottom:20px}
.list h3{margin:16px 0 6px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:8px;margin-bottom:8px}
.row img{width:46px;height:69px;object-fit:cover;border-radius:6px;background:#8884;cursor:pointer}
.row b{display:block;font-size:14px;cursor:pointer}.row small{color:var(--mut)}
.row-actions{margin-left:auto;display:flex;flex-direction:column;gap:4px}
.row-actions button{border:0;background:none;font-size:12px;font-weight:600;cursor:pointer;padding:2px 4px;text-align:right}
.btn-seen{color:var(--ac)}.btn-ignore{color:#ef4444}
.b{border:0;border-radius:10px;background:var(--ac);color:#fff;padding:10px 14px;font-weight:600;margin:2px 4px 2px 0;cursor:pointer}
.b.off{background:var(--card);color:var(--fg);box-shadow:inset 0 0 0 1px #8885}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid #8885;background:var(--card);color:var(--fg);margin-bottom:6px}
.filter-row{display:flex;gap:10px;margin-bottom:6px}.filter-col{flex:1;display:flex;flex-direction:column}
.filter-col label{font-size:12px;font-weight:600;color:var(--mut);margin-bottom:4px}
.modal-bg{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:100;backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .2s}
.modal-bg.on{opacity:1;pointer-events:auto}
.modal-content{background:var(--card);width:100%;max-width:500px;border-radius:24px 24px 0 0;padding:20px;max-height:85vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s ease-out}
.modal-bg.on .modal-content{transform:translateY(0)}
.providers-grid{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.provider-img{width:40px;height:40px;border-radius:8px;object-fit:cover}
.video-container{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:12px;margin:10px 0;background:#000}
.video-container iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#roul{position:fixed;right:14px;bottom:calc(90px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:26px;box-shadow:0 4px 14px #0006;cursor:pointer;z-index:50;display:none}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-120px);background:var(--ac);color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;font-size:14px;z-index:200;transition:transform .4s;box-shadow:0 4px 14px #0006;max-width:90%}
#toast.on{transform:translate(-50%,0)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--card);border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:20px}.stat small{color:var(--mut)}
.ach{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:8px 10px;margin-bottom:6px}
.ach.lock{opacity:.4;filter:grayscale(1)}.ach span{font-size:26px}.ach small{color:var(--mut);display:block}
.match{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px;text-align:center}.match b{font-size:28px;color:var(--ac)}
</style>
</head>
<body>
<nav id="nav"></nav>
<main id="m"></main>
<button id="roul" title="🎲">🎲</button>
<div id="toast"></div>
<div class="modal-bg" id="modalBg"><div class="modal-content" id="modalContent"></div></div>

<script>
const TMDB_KEY = "a03437a40a9ecc20a282981d75fd07b1";
const IMG = "https://image.tmdb.org/t/p/w500", IMG2 = "https://image.tmdb.org/t/p/w185";
const DEF = { key: "", seen: {}, like: {}, m: {}, pg: {}, genre: 0, year: 0, decade: 0, minRating: 0, lang: "es", theme: "", ach: {} };
let S = { ...DEF }, tab = 1, Q = [], fp = null, RC = null, RK = "", H = [], partnerRecs = null, GN = {};
try { Object.assign(S, JSON.parse(localStorage.getItem("peliswipe2")) || {}) } catch (e) {}
const m = document.getElementById("m");

// ---------- i18n ----------
const L = {
 es: { nav: ["🔍 Buscar", "🎬 Descubrir", "👀 Vistas", "🎯 Para ti", "🍿 Watch Party", "⭐ Gustos", "⚙️ Ajustes"],
  discard: "❌ Descartar", seenB: "✓ Ya la vi", like: "👍 Me gustó", dislike: "👎 No me gustó", undo: "Deshacer",
  tapTrailer: "Toca tarjeta para Tráiler", swipe: "Desliza", emptyDisc: "No hay películas con este filtro.", emptySeen: "No tienes películas vistas por calificar.",
  loading: "Cargando películas…", apiErr: "No pude cargar TMDB", apiFix: "Revisa tu API key en ⚙️ Ajustes.",
  ph: "Escribe el título de una película...", alreadySeen: "Ya la vi", added: "agregada a Vistas.", addedFav: "agregada a Favoritas.",
  forYou: "🎯 Recomendadas basadas en tus gustos", calc: "Calculando mejores recomendaciones...", rateFirst: 'Califica películas en "Vistas" para recibir recomendaciones.',
  noMore: "Sin más recomendaciones por ahora.", ignore: "No me interesa", similar: "similar a", ofFav: "de tus favoritas",
  wp: "🍿 Watch Party (Ver Juntos)", wpd: "Carga el CSV de la otra persona para calcular películas recomendadas exclusivamente para ambos.", wpLoad: "Cargar CSV Externo",
  wpUp: "Sube un archivo CSV arriba para generar las recomendaciones conjuntas.", wpMiss: "Faltan películas con 'Me gustó' en alguno de los dos archivos para calcular.",
  wpCalc: "Calculando recomendaciones para ver juntos...", wpTitle: "🎯 Recomendadas para Ver Juntos", wpBoth: "Ideal para ambos", wpNone: "No se encontraron recomendaciones conjuntas.", wpErr: "Error al calcular recomendaciones conjuntas.",
  wpMatch: "🌙 Coincidencia de gustos", wpCommon: "películas calificadas en común", wpNoCommon: "Aún no hay películas en común",
  liked: "👍 Me gustaron", disliked: "👎 No me gustaron", none1: "Aún nada en favoritas", none2: "Aún nada por aquí", remove: "↩ Quitar",
  genreH: "🎭 Género en Descubrir", all: "Todos", fy: "Filtro por Año", fd: "Filtro por Década", anyY: "Cualquier año", anyD: "Cualquier década", minR: "⭐ Nota mínima TMDB", any: "Cualquiera", orMore: "o más",
  csv: "💾 Tus gustos (CSV)", exp: "Exportar CSV", imp: "Importar CSV", data: "🗑️ Datos", reset: "Reiniciar todo", resetQ: "¿Borrar todos tus gustos?", imported: "películas importadas.",
  lang: "🌐 Idioma", theme: "🌓 Tema", light: "☀️ Claro", dark: "🌙 Oscuro (negro 100%)",
  stats: "📊 Estadísticas", sSeen: "Películas vistas", sLiked: "Me gustaron", sTime: "Tiempo total estimado", sGenre: "Género más visto", sNA: "N/A", sNote: "Tiempo estimado a 110 min por película.",
  ach: "🏆 Logros", trailerLoad: "Cargando tráiler y plataformas...", noTrailer: "Sin tráiler disponible", stream: "📺 Disponible en streaming:", noStream: "No disponible en suscripción de streaming en tu región.", dErr: "Error al cargar datos",
  trailerBtn: "▶️ Ver Tráiler", tagSeen: "✓ YA LA VI", tagDisc: "❌ DESCARTAR", tagLike: "👍 ME GUSTÓ", tagDis: "👎 NO ME GUSTÓ", unlocked: "¡Logro desbloqueado!", apiKeyH: "🔑 API key de TMDB", save: "Guardar", pasteKey: "Pega tu API key", roul: "Ruleta rápida", h: "h" },
 en: { nav: ["🔍 Search", "🎬 Discover", "👀 Seen", "🎯 For you", "🍿 Watch Party", "⭐ Tastes", "⚙️ Settings"],
  discard: "❌ Discard", seenB: "✓ Seen it", like: "👍 Liked", dislike: "👎 Disliked", undo: "Undo",
  tapTrailer: "Tap card for Trailer", swipe: "Swipe", emptyDisc: "No movies with this filter.", emptySeen: "No seen movies left to rate.",
  loading: "Loading movies…", apiErr: "Couldn't load TMDB", apiFix: "Check your API key in ⚙️ Settings.",
  ph: "Type a movie title...", alreadySeen: "Seen it", added: "added to Seen.", addedFav: "added to Favorites.",
  forYou: "🎯 Recommended based on your tastes", calc: "Calculating best recommendations...", rateFirst: 'Rate movies in "Seen" to get recommendations.',
  noMore: "No more recommendations for now.", ignore: "Not interested", similar: "similar to", ofFav: "of your favorites",
  wp: "🍿 Watch Party (Watch Together)", wpd: "Load the other person's CSV to compute movies recommended for both of you.", wpLoad: "Load External CSV",
  wpUp: "Upload a CSV above to generate joint recommendations.", wpMiss: "Both files need movies marked as 'Liked' to calculate.",
  wpCalc: "Calculating recommendations to watch together...", wpTitle: "🎯 Recommended to Watch Together", wpBoth: "Great for both", wpNone: "No joint recommendations found.", wpErr: "Error calculating joint recommendations.",
  wpMatch: "🌙 Taste match", wpCommon: "co-rated movies", wpNoCommon: "No movies in common yet",
  liked: "👍 Liked", disliked: "👎 Disliked", none1: "Nothing in favorites yet", none2: "Nothing here yet", remove: "↩ Remove",
  genreH: "🎭 Genre in Discover", all: "All", fy: "Year filter", fd: "Decade filter", anyY: "Any year", anyD: "Any decade", minR: "⭐ Minimum TMDB rating", any: "Any", orMore: "or more",
  csv: "💾 Your tastes (CSV)", exp: "Export CSV", imp: "Import CSV", data: "🗑️ Data", reset: "Reset everything", resetQ: "Delete all your tastes?", imported: "movies imported.",
  lang: "🌐 Language", theme: "🌓 Theme", light: "☀️ Light", dark: "🌙 Dark (100% black)",
  stats: "📊 Statistics", sSeen: "Movies seen", sLiked: "Liked", sTime: "Estimated total time", sGenre: "Most watched genre", sNA: "N/A", sNote: "Time estimated at 110 min per movie.",
  ach: "🏆 Achievements", trailerLoad: "Loading trailer and providers...", noTrailer: "No trailer available", stream: "📺 Available on streaming:", noStream: "Not available on subscription streaming in your region.", dErr: "Error loading data",
  trailerBtn: "▶️ Watch Trailer", tagSeen: "✓ SEEN IT", tagDisc: "❌ DISCARD", tagLike: "👍 LIKED", tagDis: "👎 DISLIKED", unlocked: "Achievement unlocked!", apiKeyH: "🔑 TMDB API key", save: "Save", pasteKey: "Paste your API key", roul: "Quick roulette", h: "h" }
};
const T = k => (L[S.lang] || L.es)[k] ?? k;
const loc = () => S.lang == "en" ? "en-US" : "es-ES";

// ---------- tema ----------
const applyTheme = () => {
  const t = S.theme || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
  document.documentElement.dataset.theme = t;
};
applyTheme();

// ---------- logros ----------
const cnt = () => ({ seen: Object.values(S.seen).filter(Boolean).length, ans: Object.keys(S.seen).length, rated: Object.keys(S.like).length });
const ACH = [
  { id: "first", ic: "👆", es: ["Primer Swipe", "Responde tu primera película"], en: ["First Swipe", "Answer your first movie"], ok: c => c.ans >= 1 },
  { id: "rater", ic: "📝", es: ["Crítico", "Califica 20 películas"], en: ["Critic", "Rate 20 movies"], ok: c => c.rated >= 20 },
  { id: "marathon", ic: "🏃", es: ["Maratónico", "Marca 50 películas como vistas"], en: ["Marathoner", "Mark 50 movies as seen"], ok: c => c.seen >= 50 },
  { id: "cinephile", ic: "🎞️", es: ["Cinéfilo", "Marca 100 películas como vistas"], en: ["Cinephile", "Mark 100 movies as seen"], ok: c => c.seen >= 100 },
  { id: "oled", ic: "🌑", es: ["Cinéfilo OLED", "Activa el tema oscuro 100% negro"], en: ["OLED Cinephile", "Enable the 100% black theme"], ok: () => false },
  { id: "roulette", ic: "🎲", es: ["Jugador", "Usa la ruleta rápida"], en: ["Gambler", "Use the quick roulette"], ok: () => false },
  { id: "party", ic: "🍿", es: ["Alma de la fiesta", "Compara gustos en Watch Party"], en: ["Party Soul", "Compare tastes in Watch Party"], ok: () => false }
];
let toastT = null;
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2600) }
function unlock(id) {
  if (S.ach[id]) return; const a = ACH.find(x => x.id == id); if (!a) return;
  S.ach[id] = Date.now(); try { localStorage.setItem("peliswipe2", JSON.stringify(S)) } catch (e) {}
  toast(`🏆 ${T("unlocked")} ${a.ic} ${a[S.lang]?.[0] || a.es[0]}`);
}
const save = () => { try { localStorage.setItem("peliswipe2", JSON.stringify(S)) } catch (e) {} const c = cnt(); ACH.forEach(a => { if (a.ok(c)) unlock(a.id) }) };

// ---------- API ----------
async function api(path, params = {}) {
  const u = new URL("https://api.themoviedb.org/3" + path);
  u.searchParams.set("language", loc());
  for (const k in params) u.searchParams.set(k, params[k]);
  const K = TMDB_KEY || S.key, h = {};
  if (K.length > 40) h.Authorization = "Bearer " + K; else u.searchParams.set("api_key", K);
  const r = await fetch(u, { headers: h });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
const n = x => ({ id: x.id, t: x.title, y: (x.release_date || "").slice(0, 4), p: x.poster_path, r: x.vote_average || 0, g: x.genre_ids || x.g || [] });
const mm = x => ({ id: x.id, t: x.t, y: x.y, p: x.p, g: x.g || [] });

async function more() {
  const g = S.genre || 0; S.pg[g] = (S.pg[g] || 0) + 1; if (S.pg[g] > 500) return;
  const p = { sort_by: "vote_count.desc", "vote_count.gte": 200, page: S.pg[g] };
  if (g) p.with_genres = g;
  if (S.year) p.primary_release_year = S.year;
  if (S.decade) { p["primary_release_date.gte"] = S.decade + "-01-01"; p["primary_release_date.lte"] = (S.decade + 9) + "-12-31" }
  if (S.minRating) p["vote_average.gte"] = S.minRating;
  const d = await api("/discover/movie", p);
  d.results.map(n).filter(x => x.p && !(x.id in S.seen) && !Q.some(q => q.id == x.id)).forEach(x => Q.push(x));
  save();
}
function fill() { return fp || (fp = (async () => { let t = 0; while (Q.length < 10 && t++ < 5) await more() })().finally(() => fp = null)) }
const ans = (x, r) => { S.m[x.id] = mm(x); S.seen[x.id] = !!r; save() };
const err = e => { m.innerHTML = `<div class="empty">${T("apiErr")} (${e.message}).<br>${T("apiFix")}</div>` };

function cardHTML(x, top) {
  const a = tab == 1 ? [T("tagSeen"), T("tagDisc")] : [T("tagLike"), T("tagDis")];
  return `<div class="card${top ? "" : " back"}" style="background-image:url(${IMG}${x.p})">
    ${top ? `<div class="play-hint" data-action="trailer">${T("trailerBtn")}</div>` : ""}
    <div class="tag r">${a[0]}</div><div class="tag l">${a[1]}</div>
    <div class="info"><h2>${x.t}</h2><p>${x.y} · ⭐ ${x.r ? x.r.toFixed(1) : "N/A"}</p></div></div>`;
}

function closeModal() { document.getElementById("modalBg").classList.remove("on"); document.getElementById("modalContent").innerHTML = "" }
async function openDetails(id, title, year) {
  const mb = document.getElementById("modalBg"), mc = document.getElementById("modalContent");
  mc.innerHTML = `<p class="hint">${T("trailerLoad")}</p>`; mb.classList.add("on");
  try {
    const [videos, prov] = await Promise.all([api(`/movie/${id}/videos`), api(`/movie/${id}/watch/providers`)]);
    let vr = videos.results;
    if (!vr.length && S.lang != "en") { try { vr = (await api(`/movie/${id}/videos`, { language: "en-US" })).results } catch (e) {} }
    const tr = vr.find(v => v.site === "YouTube" && (v.type === "Trailer" || v.type === "Teaser")) || vr[0];
    const pe = prov.results?.PE || prov.results?.CL || prov.results?.MX || {}, st = pe.flatrate || [];
    mc.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h2 style="margin:0">${title} <small>(${year})</small></h2><button id="closeModal" style="border:0;background:none;font-size:20px;cursor:pointer">✖️</button></div>
      ${tr ? `<div class="video-container"><iframe src="https://www.youtube.com/embed/${tr.key}" allow="autoplay" allowfullscreen></iframe></div>` : `<p class="hint">${T("noTrailer")}</p>`}
      <h3>${T("stream")}</h3><div class="providers-grid">${st.length ? st.map(p => `<img class="provider-img" src="${IMG2}${p.logo_path}" title="${p.provider_name}">`).join("") : `<p class="hint">${T("noStream")}</p>`}</div>`;
    document.getElementById("closeModal").onclick = closeModal;
  } catch (e) { mc.innerHTML = `<p class="hint">${T("dErr")} (${e.message})</p>` }
}
document.getElementById("modalBg").onclick = e => { if (e.target.id == "modalBg") closeModal() };

function deck(list, onAns, txtL, txtR, empty) {
  const pc = matchMedia("(hover:hover)").matches;
  m.innerHTML = `<p class="hint">${pc ? `<kbd>A</kbd> / <kbd>←</kbd> ${txtL} · <kbd>D</kbd> / <kbd>→</kbd> ${txtR} · ${T("tapTrailer")}` : `${T("swipe")} → ${txtR} · ← ${txtL}`}</p><div id="deck"></div><div class="btns"><button id="bl">${txtL}</button><button id="bu" class="sm" title="${T("undo")} (Z)">↩</button><button id="br">${txtR}</button></div>`;
  const d = document.getElementById("deck");
  if (!list.length) { m.innerHTML = `<div class="empty">${empty}</div>`; return }
  d.innerHTML = (list[1] ? cardHTML(list[1], 0) : "") + cardHTML(list[0], 1);
  const c = d.lastElementChild, tl = c.querySelector(".tag.l"), tr = c.querySelector(".tag.r");
  let sx = null, dx = 0, moved = false, done = false;
  const set = v => { dx = v; c.style.transform = `translateX(${v}px) rotate(${v / 18}deg)`; tr.style.opacity = Math.max(0, v / 100); tl.style.opacity = Math.max(0, -v / 100) };
  const go = r => { if (done) return; done = true; c.style.transition = "transform .3s"; c.style.transform = `translateX(${r ? 600 : -600}px) rotate(${r ? 30 : -30}deg)`; setTimeout(() => onAns(list[0], r), 250) };
  c.onpointerdown = e => { sx = e.clientX; moved = false; c.setPointerCapture(e.pointerId); c.style.transition = "none" };
  c.onpointermove = e => { if (sx !== null) { if (Math.abs(e.clientX - sx) > 5) moved = true; set(e.clientX - sx) } };
  c.onpointerup = c.onpointercancel = e => {
    if (sx === null) return; sx = null;
    if (!moved) { openDetails(list[0].id, list[0].t, list[0].y); c.style.transition = "transform .2s"; set(0); return }
    if (dx > 100) go(1); else if (dx < -100) go(0); else { c.style.transition = "transform .2s"; set(0) }
  };
  document.getElementById("bu").onclick = undo; document.getElementById("br").onclick = () => go(1); document.getElementById("bl").onclick = () => go(0);
  window.key = e => { if (e.key == "ArrowRight") go(1); if (e.key == "ArrowLeft") go(0) };
}

const undo = () => { const h = H.pop(); if (!h) return; if (h.tab == 1) { delete S.seen[h.x.id]; delete S.m[h.x.id]; Q.unshift(h.x) } else delete S.like[h.x.id]; tab = h.tab; save(); draw() };
document.addEventListener("keydown", e => {
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k == "z" && (tab == 1 || tab == 2)) { undo(); return }
  if (window.key) window.key({ key: k == "a" ? "ArrowLeft" : k == "d" ? "ArrowRight" : e.key })
});

// ---------- Ruleta ----------
document.getElementById("roul").onclick = () => {
  if (tab != 1 || !Q.length) return;
  const i = Math.floor(Math.random() * Q.length), [x] = Q.splice(i, 1); Q.unshift(x);
  unlock("roulette"); draw();
};

const lst = v => Object.values(S.m).filter(x => S.like[x.id] === v);
const row = (x, ex) => `<div class="row"><img loading="lazy" src="${x.p ? IMG2 + x.p : ""}" alt="" data-id="${x.id}" data-title="${x.t}" data-year="${x.y}"><div><b data-id="${x.id}" data-title="${x.t}" data-year="${x.y}">${x.t}</b><small>${x.y}${x.sub ? " · " + x.sub : ""}</small></div><div class="row-actions">${ex}</div></div>`;
const openRow = target => { const r = target.closest(".row"); if (r) { const i = r.querySelector("img"); if (i) openDetails(i.dataset.id, i.dataset.title, i.dataset.year) } };

// 0. BUSCAR
async function d0() {
  m.innerHTML = `<div class="list"><input type="text" id="srch" placeholder="${T("ph")}"><div id="srchRes"></div></div>`;
  const inpt = document.getElementById("srch"), res = document.getElementById("srchRes"); let t = null;
  inpt.oninput = () => {
    clearTimeout(t); const q = inpt.value.trim();
    if (!q) { res.innerHTML = ""; return }
    t = setTimeout(async () => {
      try {
        const d = await api("/search/movie", { query: q }), items = d.results.slice(0, 15).map(n);
        res.innerHTML = items.map(x => row(x, `<button class="btn-seen" data-a="addSeen" data-id="${x.id}">${T("alreadySeen")}</button><button class="btn-seen" data-a="addLike" data-id="${x.id}">${T("like")}</button>`)).join("");
        res.onclick = e => {
          const b = e.target.closest("[data-a]");
          if (b) {
            const id = +b.dataset.id, it = items.find(i => i.id == id);
            if (b.dataset.a == "addSeen") { S.m[id] = mm(it); S.seen[id] = true; save(); alert(`"${it.t}" ${T("added")}`) }
            if (b.dataset.a == "addLike") { S.m[id] = mm(it); S.seen[id] = true; S.like[id] = true; save(); alert(`"${it.t}" ${T("addedFav")}`) }
            return;
          }
          openRow(e.target);
        };
      } catch (e) {}
    }, 300);
  };
}

// 1. DESCUBRIR
async function d1() {
  Q = Q.filter(x => !(x.id in S.seen));
  if (Q.length < 3) { m.innerHTML = `<div class="empty">${T("loading")}</div>`; try { await fill() } catch (e) { return err(e) } }
  else if (Q.length < 10) fill().catch(() => {});
  if (tab != 1) return;
  Q.slice(0, 4).forEach(x => { new Image().src = IMG + x.p });
  deck(Q.slice(0, 2), (x, r) => { Q.shift(); ans(x, r); H.push({ tab: 1, x }); draw() }, T("discard"), T("seenB"), T("emptyDisc"));
}

// 2. VISTAS
function d2() {
  const l = Object.values(S.m).filter(x => S.seen[x.id] && !(x.id in S.like));
  deck(l.slice(0, 2), (x, r) => { S.like[x.id] = !!r; H.push({ tab: 2, x }); save(); draw() }, T("dislike"), T("like"), T("emptySeen"));
}

// 3. PARA TI
async function d3() {
  const Lk = lst(true), N = lst(false), key = Lk.length + "/" + N.length + S.lang;
  m.innerHTML = `<div class="list"><h3>${T("forYou")}</h3><div id="rc"><p class="hint">${T("calc")}</p></div></div>`;
  const el = document.getElementById("rc");
  if (!Lk.length) { el.innerHTML = `<p class="hint">${T("rateFirst")}</p>`; return }
  if (RK != key) {
    const pick = (a, k) => [...a].sort(() => Math.random() - .5).slice(0, k), sc = {}, mt = {};
    const run = (arr, w) => Promise.all(arr.map(async x => { try { const d = await api(`/movie/${x.id}/recommendations`); d.results.forEach(r => { if (!r.poster_path || S.seen[r.id] === true) return; mt[r.id] = n(r); const c = sc[r.id] || (sc[r.id] = { s: 0, c: 0 }); c.s += w * (1 + r.vote_average / 10); if (w > 0) c.c++ }) } catch (e) {} }));
    await run(pick(Lk, 10), 1); await run(pick(N, 5), -1.5);
    RC = Object.keys(sc).filter(i => sc[i].s > 0).sort((a, b) => sc[b].s - sc[a].s).slice(0, 25).map(i => ({ ...mt[i], sub: `⭐ ${mt[i].r.toFixed(1)} · ${T("similar")} ${sc[i].c} ${T("ofFav")}` })); RK = key;
  }
  if (tab != 3) return;
  el.innerHTML = RC.map(x => row(x, `<button class="btn-seen" data-a="seen" data-id="${x.id}">${T("alreadySeen")}</button><button class="btn-ignore" data-a="ignore" data-id="${x.id}">${T("ignore")}</button>`)).join("") || `<p class="hint">${T("noMore")}</p>`;
  el.onclick = e => {
    const b = e.target.closest("[data-a]");
    if (b) {
      const id = +b.dataset.id, r = RC.find(x => x.id == id); S.m[id] = mm(r); S.seen[id] = true;
      if (b.dataset.a == "ignore") S.like[id] = false;
      RC = RC.filter(x => x.id != id); save(); draw(); return;
    }
    openRow(e.target);
  };
}

// 4. WATCH PARTY
async function d4() {
  m.innerHTML = `<div class="list"><div style="background:var(--card);padding:14px;border-radius:12px;margin-bottom:14px"><b>${T("wp")}</b><br><small class="hint" style="display:block;margin:4px 0 10px">${T("wpd")}</small><button class="b" id="loadPartner">${T("wpLoad")}</button><input type="file" id="fPartner" accept=".csv" hidden></div><div id="partnerContent">${partnerRecs || `<p class="hint">${T("wpUp")}</p>`}</div></div>`;
  document.getElementById("loadPartner").onclick = () => document.getElementById("fPartner").click();
  document.getElementById("fPartner").onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    f.text().then(async txt => {
      const pLikes = [], pAll = {};
      parse(txt.replace(/^\ufeff/, "")).forEach((r, i) => {
        if (i > 0 && r[0] && +r[0]) { if (r[5] === "1" || r[5] === "0") pAll[+r[0]] = r[5]; if (r[5] == "1") pLikes.push({ id: +r[0], t: r[1] }) }
      });
      const myLikes = lst(true);
      if (!pLikes.length || !myLikes.length) { alert(T("wpMiss")); return }
      // % de coincidencia: de las películas calificadas por ambos, cuántas coinciden en gusto
      let common = 0, same = 0;
      for (const id in pAll) { if (id in S.like) { common++; if ((S.like[id] ? "1" : "0") == pAll[id]) same++ } }
      const pct = common ? Math.round(same / common * 100) : 0;
      const matchHTML = `<div class="match">${T("wpMatch")}<br><b>${pct}%</b><br><small class="hint">${common ? `${same}/${common} ${T("wpCommon")}` : T("wpNoCommon")}</small></div>`;
      unlock("party");
      const pc = document.getElementById("partnerContent");
      pc.innerHTML = matchHTML + `<p class="hint">${T("wpCalc")}</p>`;
      try {
        const pick = (arr, k) => [...arr].sort(() => Math.random() - .5).slice(0, k), sc = {}, mt = {};
        const run = arr => Promise.all(arr.map(async x => { try { const d = await api(`/movie/${x.id}/recommendations`); d.results.forEach(r => { if (!r.poster_path || S.seen[r.id] === true) return; mt[r.id] = n(r); sc[r.id] = (sc[r.id] || 0) + (1 + r.vote_average / 10) }) } catch (e) {} }));
        await run(pick(myLikes, 8)); await run(pick(pLikes, 8));
        const list = Object.keys(sc).sort((a, b) => sc[b] - sc[a]).slice(0, 25).map(i => ({ ...mt[i], sub: `⭐ ${mt[i].r.toFixed(1)} · ${T("wpBoth")}` }));
        partnerRecs = matchHTML + (list.length ? `<h3>${T("wpTitle")} (${list.length})</h3>` + list.map(x => row(x, `<button class="btn-seen" data-a="seen" data-id="${x.id}">${T("alreadySeen")}</button>`)).join("") : `<p class="hint">${T("wpNone")}</p>`);
        pc.innerHTML = partnerRecs;
      } catch (err) { pc.innerHTML = matchHTML + `<p class="hint">${T("wpErr")}</p>` }
    });
  };
  document.getElementById("partnerContent").onclick = e => {
    const b = e.target.closest("[data-a]");
    if (b && b.dataset.a == "seen") { S.seen[+b.dataset.id] = true; save(); b.closest(".row").remove(); return }
    openRow(e.target);
  };
}

// 5. GUSTOS
async function d5() {
  const Lk = lst(true), N = lst(false), un = `<button class="btn-seen" data-a="undo" data-id="`;
  m.innerHTML = `<div class="list"><h3>${T("liked")} (${Lk.length})</h3>${Lk.map(x => row(x, `${un}${x.id}">${T("remove")}</button>`)).join("") || `<p class="hint">${T("none1")}</p>`}<h3>${T("disliked")} (${N.length})</h3>${N.map(x => row(x, `${un}${x.id}">${T("remove")}</button>`)).join("") || `<p class="hint">${T("none2")}</p>`}</div>`;
  m.querySelector(".list").onclick = e => {
    const b = e.target.closest("[data-a]");
    if (b && b.dataset.a == "undo") { delete S.like[+b.dataset.id]; save(); draw(); return }
    openRow(e.target);
  };
}

// ---------- CSV ----------
const esc = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
function parse(t) {
  const rows = []; let r = [], c = "", q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch == '"') { if (t[i + 1] == '"') { c += '"'; i++ } else q = false } else c += ch }
    else if (ch == '"') q = true;
    else if (ch == ",") { r.push(c); c = "" }
    else if (ch == "\n" || ch == "\r") { if (ch == "\r" && t[i + 1] == "\n") i++; r.push(c); c = ""; rows.push(r); r = [] }
    else c += ch;
  }
  if (c || r.length) { r.push(c); rows.push(r) }
  return rows;
}
function exportCSV() {
  const rows = ["id,titulo,anio,poster,vista,gusto,generos"];
  for (const id in S.seen) { const x = S.m[id] || {}; rows.push([id, esc(x.t), x.y, x.p, S.seen[id] ? 1 : 0, id in S.like ? (S.like[id] ? 1 : 0) : "", esc((x.g || []).join("|"))].join(",")) }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["\ufeff" + rows.join("\n")], { type: "text/csv" })); a.download = "peliswipe-gustos.csv"; a.click();
}
function importCSV(txt) {
  let k = 0;
  parse(txt.replace(/^\ufeff/, "")).forEach((r, i) => {
    const id = +r[0]; if (!id || i == 0 && r[0] == "id") return;
    S.m[id] = { id, t: r[1], y: r[2], p: r[3], g: (r[6] || "").split("|").filter(Boolean).map(Number) }; S.seen[id] = r[4] == "1"; if (r[5] === "1" || r[5] === "0") S.like[id] = r[5] == "1"; k++;
  });
  save(); RK = ""; Q = []; alert(k + " " + T("imported")); draw();
}

// 6. AJUSTES
async function d6() {
  let yo = `<option value="0">${T("anyY")}</option>`; for (let y = 2026; y >= 1950; y--) yo += `<option value="${y}">${y}</option>`;
  let ro = `<option value="0">${T("any")}</option>`; for (let r = 1; r <= 10; r++) ro += `<option value="${r}">${r}.0 ${T("orMore")}</option>`;
  const c = cnt(), hrs = c.seen * 110 / 60;
  const gc = {}; Object.values(S.m).filter(x => S.seen[x.id]).forEach(x => (x.g || []).forEach(g => gc[g] = (gc[g] || 0) + 1));
  const topG = Object.keys(gc).sort((a, b) => gc[b] - gc[a])[0];
  const sel = (id, cur, a, b) => `<button class="b${cur == a[0] ? "" : " off"}" data-${id}="${a[0]}">${a[1]}</button><button class="b${cur == b[0] ? "" : " off"}" data-${id}="${b[0]}">${b[1]}</button>`;
  const curTheme = document.documentElement.dataset.theme;
  m.innerHTML = `<div class="list">
    ${TMDB_KEY ? "" : `<h3>${T("apiKeyH")}</h3><input id="k" value="${S.key}" placeholder="${T("pasteKey")}"><button class="b" id="sk">${T("save")}</button>`}
    <h3>${T("stats")}</h3>
    <div class="stats"><div class="stat"><b>${c.seen}</b><small>${T("sSeen")}</small></div><div class="stat"><b>${lst(true).length}</b><small>${T("sLiked")}</small></div>
    <div class="stat"><b>${hrs.toFixed(1)} ${T("h")}</b><small>${T("sTime")}</small></div><div class="stat"><b id="topG">${topG ? (GN[topG] || "…") : T("sNA")}</b><small>${T("sGenre")}</small></div></div>
    <small class="hint" style="display:block">${T("sNote")}</small>
    <h3>${T("lang")}</h3><div id="sl">${sel("lang", S.lang, ["es", "ES"], ["en", "EN"])}</div>
    <h3>${T("theme")}</h3><div id="st">${sel("theme", curTheme, ["light", T("light")], ["dark", T("dark")])}</div>
    <h3>${T("genreH")}</h3><select id="g"><option value="0">${T("all")}</option></select>
    <div class="filter-row"><div class="filter-col"><label>${T("fy")}</label><select id="fy">${yo}</select></div>
    <div class="filter-col"><label>${T("fd")}</label><select id="fd"><option value="0">${T("anyD")}</option>${[2020, 2010, 2000, 1990, 1980, 1970].map(d => `<option value="${d}">${d}s</option>`).join("")}</select></div></div>
    <h3>${T("minR")}</h3><select id="fr">${ro}</select>
    <h3>${T("csv")}</h3><button class="b" id="ex">${T("exp")}</button><button class="b" id="im">${T("imp")}</button><input type="file" id="f" accept=".csv" hidden>
    <h3>${T("ach")} (${Object.keys(S.ach).length}/${ACH.length})</h3>
    ${ACH.map(a => { const u = S.ach[a.id], t = a[S.lang] || a.es; return `<div class="ach${u ? "" : " lock"}"><span>${a.ic}</span><div><b>${t[0]}</b><small>${t[1]}</small></div></div>` }).join("")}
    <h3>${T("data")}</h3><button class="b" id="rs" style="background:#ef4444">${T("reset")}</button></div>`;
  const $ = i => document.getElementById(i);
  if (!TMDB_KEY) $("sk").onclick = () => { S.key = $("k").value.trim(); Q = []; RC = null; RK = ""; save(); tab = 1; draw() };
  $("ex").onclick = exportCSV; $("im").onclick = () => $("f").click();
  $("f").onchange = e => { const f = e.target.files[0]; if (f) f.text().then(importCSV) };
  $("rs").onclick = () => { if (confirm(T("resetQ"))) { S = { ...DEF, key: S.key, lang: S.lang, theme: S.theme, ach: S.ach, seen: {}, like: {}, m: {}, pg: {} }; Q = []; RC = null; partnerRecs = null; save(); tab = 1; draw() } };
  $("g").onchange = e => { S.genre = +e.target.value; Q = []; save() };
  $("fy").onchange = e => { S.year = +e.target.value; if (S.year) S.decade = 0; Q = []; save(); draw() };
  $("fd").onchange = e => { S.decade = +e.target.value; if (S.decade) S.year = 0; Q = []; save(); draw() };
  $("fr").onchange = e => { S.minRating = +e.target.value; Q = []; save() };
  $("sl").onclick = e => { const b = e.target.closest("[data-lang]"); if (!b || b.dataset.lang == S.lang) return; S.lang = b.dataset.lang; S.pg = {}; Q = []; RC = null; RK = ""; partnerRecs = null; GN = {}; save(); draw() };
  $("st").onclick = e => { const b = e.target.closest("[data-theme]"); if (!b) return; S.theme = b.dataset.theme; applyTheme(); if (S.theme == "dark") unlock("oled"); save(); draw() };
  if (TMDB_KEY || S.key) try {
    const g = await api("/genre/movie/list");
    GN = {}; g.genres.forEach(x => GN[x.id] = x.name);
    if (tab != 6) return;
    $("topG").textContent = topG ? (GN[topG] || T("sNA")) : T("sNA");
    $("g").innerHTML = `<option value="0">${T("all")}</option>` + g.genres.map(x => `<option value="${x.id}">${x.name}</option>`).join("");
    $("g").value = S.genre || 0; $("fy").value = S.year || 0; $("fd").value = S.decade || 0; $("fr").value = S.minRating || 0;
  } catch (e) {}
}

function draw() {
  window.key = null;
  document.documentElement.lang = S.lang;
  const nav = document.getElementById("nav");
  if (nav.children.length != 7) { nav.innerHTML = [0, 1, 2, 3, 4, 5, 6].map(i => `<button id="t${i}"></button>`).join(""); [0, 1, 2, 3, 4, 5, 6].forEach(i => document.getElementById("t" + i).onclick = () => { tab = i; draw() }) }
  [0, 1, 2, 3, 4, 5, 6].forEach(i => { const b = document.getElementById("t" + i); b.className = i == tab ? "on" : ""; b.textContent = T("nav")[i] });
  if (!(TMDB_KEY || S.key) && tab < 6) tab = 6;
  document.getElementById("roul").style.display = tab == 1 ? "block" : "none";
  document.getElementById("roul").title = T("roul");
  [d0, d1, d2, d3, d4, d5, d6][tab]().catch(err);
}
draw();
