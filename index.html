<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PeliSwipe</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎬%3C/text%3E%3C/svg%3E">
  <style>
    :root{--bg:#f4f4f7;--fg:#1a1a22;--card:#fff;--mut:#6b6b7a;--ac:#6d28d9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
    @media(prefers-color-scheme:dark){:root{--bg:#101015;--fg:#f1f1f6;--card:#1c1c25;--mut:#9a9aab}}
    *{box-sizing:border-box}html,body{margin:0;height:100%}
    body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none}
    nav{display:flex;gap:4px;padding:8px 4px;justify-content:center;overflow-x:auto}
    nav button{flex:1;max-width:110px;border:0;border-radius:20px;padding:8px 2px;background:var(--card);color:var(--fg);font-weight:600;font-size:12px;cursor:pointer;white-space:nowrap}
    nav button.on{background:var(--ac);color:#fff}
    main{flex:1;display:flex;flex-direction:column;align-items:center;min-height:0;padding:0 14px 10px;position:relative}
    .hint{color:var(--mut);font-size:13px;margin:4px 0 8px;text-align:center}
    #deck{position:relative;flex:1;width:100%;max-width:380px;min-height:0}
    .card{position:absolute;inset:0;border-radius:22px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;box-shadow:0 8px 24px #0004;touch-action:none;user-select:none;background:#333 center/cover;cursor:grab}
    .card:active{cursor:grabbing}
    .card .play-hint{position:absolute;top:16px;right:16px;background:#0008;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:16px;backdrop-filter:blur(4px)}
    a{color:inherit}.credits{text-align:center;margin-top:18px}.credits svg{height:auto}
    kbd{background:var(--card);border:1px solid #8885;border-radius:5px;padding:1px 6px;font-size:12px;font-family:inherit}
    .btns button.sm{width:46px;height:46px;font-size:20px;align-self:center}
    .card.back{transform:scale(.95) translateY(10px);opacity:.7}
    .info{padding:60px 20px 20px;background:linear-gradient(transparent,#000d)}
    .info h2{margin:0;font-size:24px;line-height:1.2}.info p{margin:4px 0 0;opacity:.85;font-size:13px}
    .tag{position:absolute;top:24px;padding:4px 12px;border:4px solid;border-radius:10px;font-size:26px;font-weight:800;opacity:0;background:#0006}
    .tag.r{right:20px;color:#4ade80;border-color:#4ade80;transform:rotate(12deg)}.tag.l{left:20px;color:#f87171;border-color:#f87171;transform:rotate(-12deg)}
    .btns{display:flex;gap:28px;padding:12px 0 4px}
    .btns button{width:68px;height:68px;border-radius:50%;border:0;font-size:30px;background:var(--card);box-shadow:0 3px 10px #0003;cursor:pointer}
    .empty{margin:auto;text-align:center;color:var(--mut);padding:20px}
    .list{width:100%;max-width:520px;overflow-y:auto;flex:1}
    .list h3{margin:16px 0 6px}
    .row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:8px;margin-bottom:8px}
    .row img{width:46px;height:69px;object-fit:cover;border-radius:6px;background:#8884}
    .row b{display:block;font-size:14px}.row small{color:var(--mut)}
    .row-actions{margin-left:auto;display:flex;flex-direction:column;gap:4px}
    .row-actions button{border:0;background:none;font-size:12px;font-weight:600;cursor:pointer;padding:2px 4px;text-align:right}
    .row-actions button.btn-seen{color:var(--ac)}
    .row-actions button.btn-ignore{color:#ef4444}
    .b{border:0;border-radius:10px;background:var(--ac);color:#fff;padding:10px 14px;font-weight:600;margin:2px 4px 2px 0;cursor:pointer}
    input,select{width:100%;padding:10px;border-radius:10px;border:1px solid #8885;background:var(--card);color:var(--fg);margin-bottom:6px}
    
    /* Modal / Bottom Sheet para Tráiler y Dónde ver */
    .modal-bg{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:100;backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .2s}
    .modal-bg.on{opacity:1;pointer-events:auto}
    .modal-content{background:var(--card);width:100%;max-width:500px;border-radius:24px 24px 0 0;padding:20px;max-height:85vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s ease-out}
    .modal-bg.on .modal-content{transform:translateY(0)}
    .providers-grid{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
    .provider-img{width:40px;height:40px;border-radius:8px;object-fit:cover}
    .video-container{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:12px;margin:10px 0;background:#000}
    .video-container iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
  </style>
</head>
<body>
<nav>
  <button id="t0">🎬 Descubrir</button>
  <button id="t1">👀 Vistas</button>
  <button id="t2">🎯 Para ti</button>
  <button id="t3">🔍 Buscar</button>
  <button id="t4">⭐ Gustos</button>
  <button id="t5">⚙️ Ajustes</button>
</nav>
<main id="m"></main>

<!-- Modal para Detalle / Tráiler / Plataformas -->
<div class="modal-bg" id="modalBg">
  <div class="modal-content" id="modalContent"></div>
</div>

<script>
const TMDB_KEY = "a03437a40a9ecc20a282981d75fd07b1"; 
const IMG = "https://image.tmdb.org/t/p/w500", IMG2 = "https://image.tmdb.org/t/p/w185";
let S = { key: "", seen: {}, like: {}, m: {}, pg: {}, genre: 0, year: 0, minRating: 0 }, tab = 0, Q = [], fp = null, RC = null, RK = "", H = [], partnerData = null;

try { Object.assign(S, JSON.parse(localStorage.getItem("peliswipe2")) || {}) } catch(e) {}
const save = () => { try { localStorage.setItem("peliswipe2", JSON.stringify(S)) } catch(e) {} };
const m = document.getElementById("m");

async function api(path, params = {}) {
  const u = new URL("https://api.themoviedb.org/3" + path);
  u.searchParams.set("language", "es-ES");
  for (const k in params) u.searchParams.set(k, params[k]);
  const K = TMDB_KEY || S.key, h = {};
  if (K.length > 40) h.Authorization = "Bearer " + K; else u.searchParams.set("api_key", K);
  const r = await fetch(u, { headers: h });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

const n = x => ({ id: x.id, t: x.title, y: (x.release_date || "").slice(0, 4), p: x.poster_path, r: x.vote_average || 0 });

async function more() {
  const g = S.genre || 0; S.pg[g] = (S.pg[g] || 0) + 1; if (S.pg[g] > 500) return;
  const p = { sort_by: "vote_count.desc", "vote_count.gte": 200, page: S.pg[g] };
  if (g) p.with_genres = g;
  if (S.year) p.primary_release_year = S.year;
  if (S.minRating) p["vote_average.gte"] = S.minRating;
  
  const d = await api("/discover/movie", p);
  d.results.map(n).filter(x => x.p && !(x.id in S.seen) && !Q.some(q => q.id == x.id)).forEach(x => Q.push(x));
  save();
}

function fill() { return fp || (fp = (async () => { let t = 0; while (Q.length < 10 && t++ < 5) await more() })().finally(() => fp = null)) }
const ans = (x, r) => { S.m[x.id] = { id: x.id, t: x.t, y: x.y, p: x.p }; S.seen[x.id] = !!r; save() };
const err = e => { m.innerHTML = `<div class="empty">No pude cargar TMDB (${e.message}).<br>Revisa tu API key en ⚙️ Ajustes.</div>` };

function cardHTML(x, top) {
  return `<div class="card${top ? "" : " back"}" style="background-image:url(${IMG}${x.p})">
    ${top ? '<div class="play-hint" title="Ver Tráiler / Dónde ver">▶️</div>' : ''}
    <div class="tag r">${tab ? "ME GUSTÓ" : "VISTA"}</div>
    <div class="tag l">${tab ? "NO ME GUSTÓ" : "NO VISTA"}</div>
    <div class="info"><h2>${x.t}</h2><p>${x.y} · ⭐ ${x.r ? x.r.toFixed(1) : "N/A"}</p></div>
  </div>`;
}

// Modal de detalles (Tráiler + Dónde ver)
async function openDetails(item) {
  const mb = document.getElementById("modalBg"), mc = document.getElementById("modalContent");
  mc.innerHTML = `<p class="hint">Cargando tráiler y plataformas...</p>`;
  mb.classList.add("on");
  
  try {
    const [videos, providers] = await Promise.all([
      api(`/movie/${item.id}/videos`),
      api(`/movie/${item.id}/watch/providers`)
    ]);
    
    const trailer = videos.results.find(v => v.site === "YouTube" && (v.type === "Trailer" || v.type === "Teaser")) || videos.results[0];
    const pe = providers.results?.PE || providers.results?.CL || providers.results?.MX || {};
    const stream = pe.flatrate || [];

    mc.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <h2 style="margin:0">${item.t} <small>(${item.y})</small></h2>
        <button id="closeModal" style="border:0;background:none;font-size:20px;cursor:pointer">✖️</button>
      </div>
      ${trailer ? `<div class="video-container"><iframe src="https://www.youtube.com/embed/${trailer.key}" allowfullscreen></iframe></div>` : '<p class="hint">Sin tráiler disponible</p>'}
      <h3>📺 Disponible en streaming:</h3>
      <div class="providers-grid">
        ${stream.length ? stream.map(p => `<img class="provider-img" src="${IMG2}${p.logo_path}" title="${p.provider_name}">`).join("") : '<p class="hint">No disponible en suscripción de streaming en tu región.</p>'}
      </div>
    `;
    document.getElementById("closeModal").onclick = () => mb.classList.remove("on");
  } catch(e) {
    mc.innerHTML = `<p class="hint">Error al cargar datos (${e.message})</p>`;
  }
}

document.getElementById("modalBg").onclick = e => { if (e.target.id == "modalBg") e.target.classList.remove("on") };

function deck(list, onAns, txtL, txtR, empty) {
  const pc = matchMedia("(hover:hover)").matches;
  m.innerHTML = `<p class="hint">${pc ? `<kbd>A</kbd> / <kbd>←</kbd> ${txtL} · <kbd>D</kbd> / <kbd>→</kbd> ${txtR} · Toca tarjeta para Tráiler` : `Desliza → ${txtR} · ← ${txtL} · Toca para Tráiler`}</p><div id="deck"></div><div class="btns"><button id="bl" title="${txtL} (A)">✖️</button><button id="bu" class="sm" title="Deshacer (Z)">↩</button><button id="br" title="${txtR} (D)">💚</button></div>`;
  const d = document.getElementById("deck");
  if (!list.length) { m.innerHTML = `<div class="empty">${empty}</div>`; return }
  d.innerHTML = (list[1] ? cardHTML(list[1], 0) : "") + cardHTML(list[0], 1);
  const c = d.lastElementChild, tl = c.querySelector(".tag.l"), tr = c.querySelector(".tag.r");
  let sx = null, dx = 0, moved = false;
  const set = v => { dx = v; c.style.transform = `translateX(${v}px) rotate(${v / 18}deg)`; tr.style.opacity = Math.max(0, v / 100); tl.style.opacity = Math.max(0, -v / 100) };
  let done = false;
  const go = r => { if (done) return; done = true; c.style.transition = "transform .3s"; c.style.transform = `translateX(${r ? 600 : -600}px) rotate(${r ? 30 : -30}deg)`; setTimeout(() => onAns(list[0], r), 250) };
  c.onpointerdown = e => { sx = e.clientX; moved = false; c.setPointerCapture(e.pointerId); c.style.transition = "none" };
  c.onpointermove = e => { if (sx !== null) { if (Math.abs(e.clientX - sx) > 5) moved = true; set(e.clientX - sx) } };
  c.onpointerup = c.onpointercancel = () => { 
    if (sx === null) return; sx = null; 
    if (!moved) { openDetails(list[0]); c.style.transition = "transform .2s"; set(0); return; }
    if (dx > 100) go(1); else if (dx < -100) go(0); else { c.style.transition = "transform .2s"; set(0) } 
  };
  document.getElementById("bu").onclick = undo; document.getElementById("br").onclick = () => go(1); document.getElementById("bl").onclick = () => go(0);
  window.key = e => { if (e.key == "ArrowRight") go(1); if (e.key == "ArrowLeft") go(0) };
}

const undo = () => { const h = H.pop(); if (!h) return; if (h.tab == 0) { delete S.seen[h.x.id]; delete S.m[h.x.id]; Q.unshift(h.x) } else delete S.like[h.x.id]; tab = h.tab; save(); draw() };

document.addEventListener("keydown", e => {
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k == "z" && tab < 2) { undo(); return }
  if (window.key) window.key({ key: k == "a" ? "ArrowLeft" : k == "d" ? "ArrowRight" : e.key })
});

// 0. DESCUBRIR
async function d0() {
  Q = Q.filter(x => !(x.id in S.seen));
  if (Q.length < 3) { m.innerHTML = '<div class="empty">Cargando películas…</div>'; try { await fill() } catch(e) { return err(e) } }
  else if (Q.length < 10) fill().catch(() => {});
  if (tab != 0) return;
  Q.slice(0, 4).forEach(x => { new Image().src = IMG + x.p });
  deck(Q.slice(0, 2), (x, r) => { Q.shift(); ans(x, r); H.push({ tab: 0, x }); draw() }, "no la he visto", "la vi", "No hay películas con este filtro.");
}

// 1. VISTAS
function d1() {
  const l = Object.values(S.m).filter(x => S.seen[x.id] && !(x.id in S.like));
  deck(l.slice(0, 2), (x, r) => { S.like[x.id] = !!r; H.push({ tab: 1, x }); save(); draw() }, "no me gustó", "me gustó", "No tienes películas vistas por calificar.");
}

const lst = v => Object.values(S.m).filter(x => S.like[x.id] === v);
const row = (x, ex) => `<div class="row"><img loading="lazy" src="${x.p ? IMG2 + x.p : ""}" alt=""><div><b>${x.t}</b><small>${x.y}${x.sub ? " · " + x.sub : ""}</small></div><div class="row-actions">${ex}</div></div>`;

// 2. RECOMENDACIONES (PARA TI)
async function d2() {
  const L = lst(true), N = lst(false), key = L.length + "/" + N.length;
  m.innerHTML = `<div class="list"><h3>🎯 Recomendadas basadas en tus gustos</h3><div id="rc"><p class="hint">Calculando mejores recomendaciones...</p></div></div>`;
  const el = document.getElementById("rc");
  if (!L.length) { el.innerHTML = '<p class="hint">Califica películas en "Vistas" para recibir recomendaciones.</p>'; return }
  if (RK != key) {
    const pick = (a, k) => [...a].sort(() => Math.random() - .5).slice(0, k), sc = {}, mt = {};
    const run = (arr, w) => Promise.all(arr.map(async x => { try { const d = await api(`/movie/${x.id}/recommendations`); d.results.forEach(r => { if (!r.poster_path || S.seen[r.id] === true) return; mt[r.id] = n(r); const c = sc[r.id] || (sc[r.id] = { s: 0, c: 0 }); c.s += w * (1 + r.vote_average / 10); if (w > 0) c.c++ }) } catch(e) {} }));
    await run(pick(L, 10), 1); await run(pick(N, 5), -1.5);
    RC = Object.keys(sc).filter(i => sc[i].s > 0).sort((a, b) => sc[b].s - sc[a].s).slice(0, 25).map(i => ({ ...mt[i], sub: `⭐ ${mt[i].r.toFixed(1)} · similar a ${sc[i].c} de tus favoritas` })); RK = key;
  }
  if (tab != 2) return;
  el.innerHTML = RC.map(x => row(x, `<button class="btn-seen" data-a="seen" data-id="${x.id}">Ya la vi</button><button class="btn-ignore" data-a="ignore" data-id="${x.id}">No me interesa</button>`)).join("") || '<p class="hint">Sin más recomendaciones por ahora.</p>';
}

// 3. BUSCADOR MANUAL
async function d3() {
  m.innerHTML = `<div class="list">
    <input type="text" id="srch" placeholder="Escribe el título de una película...">
    <div id="srchRes"></div>
  </div>`;
  const inpt = document.getElementById("srch"), res = document.getElementById("srchRes");
  let t = null;
  inpt.oninput = () => {
    clearTimeout(t);
    const q = inpt.value.trim();
    if (!q) { res.innerHTML = ""; return; }
    t = setTimeout(async () => {
      try {
        const d = await api("/search/movie", { query: q });
        res.innerHTML = d.results.slice(0, 15).map(n).map(x => row(x, `<button class="btn-seen" data-a="addSeen" data-id="${x.id}">Ya la vi</button><button class="btn-seen" data-a="addLike" data-id="${x.id}">💚 Me gustó</button>`)).join("");
        res.onclick = e => {
          const b = e.target.closest("[data-a]"); if (!b) return;
          const id = +b.dataset.id, item = d.results.map(n).find(i => i.id == id);
          if (b.dataset.a == "addSeen") { S.m[id] = item; S.seen[id] = true; save(); alert(`"${item.t}" agregada a Vistas.`); }
          if (b.dataset.a == "addLike") { S.m[id] = item; S.seen[id] = true; S.like[id] = true; save(); alert(`"${item.t}" agregada a Favoritas.`); }
        };
      } catch(e) {}
    }, 300);
  };
}

// 4. GUSTOS + MODO PAREJA
async function d4() {
  const L = lst(true), N = lst(false);
  let matchHTML = "";
  if (partnerData) {
    const partnerLikes = Object.keys(partnerData.like || {}).filter(k => partnerData.like[k]);
    const matches = L.filter(x => partnerLikes.includes(String(x.id)));
    matchHTML = `<h3>👥 Coincidencias de Pareja (${matches.length})</h3>${matches.map(x => row(x, '')).join("") || '<p class="hint">Sin coincidencias en lo que a ambos les gusta.</p>'}`;
  }

  m.innerHTML = `<div class="list">
    <div style="background:var(--card);padding:10px;border-radius:12px;margin-bottom:12px">
      <b>👥 Modo Cita / Pareja</b><br>
      <small class="hint">Carga el CSV de tu pareja para comparar gustos.</small><br>
      <button class="b" id="loadPartner">Cargar CSV Pareja</button>
      <input type="file" id="fPartner" accept=".csv" hidden>
    </div>
    ${matchHTML}
    <h3>💚 Me gustaron (${L.length})</h3>${L.map(x => row(x, `<button class="btn-seen" data-a="undo" data-id="${x.id}">↩ Quitar</button>`)).join("") || '<p class="hint">Aún nada en favoritas</p>'}
    <h3>✖️ No me gustaron (${N.length})</h3>${N.map(x => row(x, `<button class="btn-seen" data-a="undo" data-id="${x.id}">↩ Quitar</button>`)).join("") || '<p class="hint">Aún nada por aquí</p>'}
  </div>`;

  document.getElementById("loadPartner").onclick = () => document.getElementById("fPartner").click();
  document.getElementById("fPartner").onchange = e => {
    const f = e.target.files[0];
    if (f) f.text().then(txt => {
      partnerData = { like: {} };
      parse(txt.replace(/^\ufeff/, "")).forEach((r, i) => {
        if (i > 0 && r[0]) partnerData.like[r[0]] = r[5] == "1";
      });
      alert("CSV de pareja cargado."); draw();
    });
  };
}

m.onclick = e => {
  const b = e.target.closest("[data-a]"); if (!b) return; const id = +b.dataset.id;
  if (b.dataset.a == "undo") { delete S.like[id]; save(); draw() }
  if (b.dataset.a == "seen") { const r = RC.find(x => x.id == id); S.m[id] = { id, t: r.t, y: r.y, p: r.p }; S.seen[id] = true; RC = RC.filter(x => x.id != id); save(); draw() }
  if (b.dataset.a == "ignore") { const r = RC.find(x => x.id == id); S.m[id] = { id, t: r.t, y: r.y, p: r.p }; S.seen[id] = true; S.like[id] = false; RC = RC.filter(x => x.id != id); save(); draw() }
};

// --- CSV ---
const esc = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
function parse(t) {
  const rows = []; let r = [], c = "", q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch == '"') { if (t[i + 1] == '"') { c += '"'; i++ } else q = false } else c += ch }
    else if (ch == '"') q = true;
    else if (ch == ",") { r.push(c); c = "" }
    else if (ch == "\n" || ch == "\r") { if (ch == "\r" && t[i + 1] == "\n") i++; r.push(c); c = ""; rows.push(r); r = [] }
    else c += ch;
  }
  if (c || r.length) { r.push(c); rows.push(r) }
  return rows;
}

function exportCSV() {
  const rows = ["id,titulo,anio,poster,vista,gusto"];
  for (const id in S.seen) { const x = S.m[id] || {}; rows.push([id, esc(x.t), x.y, x.p, S.seen[id] ? 1 : 0, id in S.like ? (S.like[id] ? 1 : 0) : ""].join(",")) }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["\ufeff" + rows.join("\n")], { type: "text/csv" })); a.download = "peliswipe-gustos.csv"; a.click();
}

function importCSV(txt) {
  let k = 0;
  parse(txt.replace(/^\ufeff/, "")).forEach((r, i) => {
    const id = +r[0]; if (!id || i == 0 && r[0] == "id") return;
    S.m[id] = { id, t: r[1], y: r[2], p: r[3] }; S.seen[id] = r[4] == "1"; if (r[5] === "1" || r[5] === "0") S.like[id] = r[5] == "1"; k++;
  });
  save(); RK = ""; Q = []; alert(k + " películas importadas."); draw();
}

// 5. AJUSTES (Filtros por época / nota)
async function d5() {
  m.innerHTML = `<div class="list">
    ${TMDB_KEY ? "" : `<h3>🔑 API key de TMDB</h3><input id="k" value="${S.key}" placeholder="Pega tu API key"><button class="b" id="sk">Guardar</button>`}
    <h3>🎭 Género en Descubrir</h3>
    <select id="g"><option value="0">Todos</option></select>
    
    <h3>📅 Filtro por Año</h3>
    <select id="fy">
      <option value="0">Cualquier año</option>
      <option value="2026">2026</option>
      <option value="2025">2025</option>
      <option value="2024">2024</option>
      <option value="2023">2023</option>
      <option value="2020">2020s</option>
      <option value="2010">2010s</option>
    </select>

    <h3>⭐ Nota mínima TMDB</h3>
    <select id="fr">
      <option value="0">Cualquiera</option>
      <option value="6">Más de 6.0</option>
      <option value="7">Más de 7.0 (Recomendado)</option>
      <option value="8">Más de 8.0 (Excelentes)</option>
    </select>

    <h3>💾 Tus gustos (CSV)</h3>
    <button class="b" id="ex">Exportar CSV</button>
    <button class="b" id="im">Importar CSV</button>
    <input type="file" id="f" accept=".csv" hidden>
    
    <h3>🗑️ Datos</h3>
    <button class="b" id="rs" style="background:#ef4444">Reiniciar todo</button>
  </div>`;

  const $ = i => document.getElementById(i);
  if (!TMDB_KEY) $("sk").onclick = () => { S.key = $("k").value.trim(); Q = []; RC = null; RK = ""; save(); tab = 0; draw() };
  
  $("ex").onclick = exportCSV;
  $("im").onclick = () => $("f").click();
  $("f").onchange = e => { const f = e.target.files[0]; if (f) f.text().then(importCSV) };
  $("rs").onclick = () => { if (confirm("¿Borrar todos tus gustos?")) { S = { key: S.key, seen: {}, like: {}, m: {}, pg: {}, genre: 0 }; Q = []; RC = null; RK = ""; save(); tab = 0; draw() } };
  
  $("g").onchange = e => { S.genre = +e.target.value; Q = []; save() };
  $("fy").onchange = e => { S.year = +e.target.value; Q = []; save() };
  $("fr").onchange = e => { S.minRating = +e.target.value; Q = []; save() };

  if (TMDB_KEY || S.key) try {
    const g = await api("/genre/movie/list");
    if (tab != 5) return;
    $("g").innerHTML = '<option value="0">Todos</option>' + g.genres.map(x => `<option value="${x.id}">${x.name}</option>`).join("");
    $("g").value = S.genre || 0;
    $("fy").value = S.year || 0;
    $("fr").value = S.minRating || 0;
  } catch(e) {}
}

function draw() {
  window.key = null;
  [0, 1, 2, 3, 4, 5].forEach(i => document.getElementById("t" + i).className = i == tab ? "on" : "");
  if (!(TMDB_KEY || S.key) && tab < 5) tab = 5;
  [d0, d1, d2, d3, d4, d5][tab]().catch(err);
}

[0, 1, 2, 3, 4, 5].forEach(i => document.getElementById("t" + i).onclick = () => { tab = i; draw() });
draw();
</script>
</body>
</html>
